<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore a pixel-art miniature of Hamilton, New Zealand.">
  <title>Pixel Hamilton</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="atlas" aria-label="Pixel Hamilton">
    <canvas id="map" tabindex="0" aria-label="Illustrated map. Use arrow keys to pan and plus or minus to zoom."></canvas>
    <div class="focus" aria-hidden="true"></div>
    <div id="markers" aria-label="Map landmarks"></div>
    <header>
      <p class="eyebrow">KIRIKIRIROA · AOTEAROA</p>
      <h1>Pixel Hamilton</h1>
      <p>The Waikato River in miniature.</p>
      <p id="sky" class="sky"></p>
    </header>
    <aside class="places" aria-label="Explore landmarks">
      <div class="places-head">
        <label for="places">Explore</label>
        <button id="find-bus" class="find-bus" type="button" aria-haspopup="dialog" hidden>
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="1.5" y="1" width="9" height="8.5" rx="1.5" fill="currentColor"/><rect x="3" y="2.5" width="6" height="3" fill="#203830"/><rect x="2.5" y="9" width="2" height="2" fill="currentColor"/><rect x="7.5" y="9" width="2" height="2" fill="currentColor"/></svg>
          Buses
        </button>
      </div>
      <select id="places"><option value="">City overview</option></select>
    </aside>
    <p id="loading" role="status">Drawing the city…</p>
    <dialog id="buses" aria-labelledby="buses-title">
      <div class="dialog-head">
        <h2 id="buses-title">Running now</h2>
        <button id="close-buses" type="button" aria-label="Close">×</button>
      </div>
      <input id="bus-search" type="search" placeholder="Route, destination or stop" aria-label="Filter buses and trains" autocomplete="off">
      <ul id="bus-list" class="bus-list"></ul>
      <p id="bus-empty" class="bus-empty" hidden></p>
    </dialog>
    <section id="detail" hidden aria-live="polite"></section>
    <div class="tools">
      <div class="zoom" aria-label="Map controls">
        <button id="out" aria-label="Zoom out">−</button>
        <button id="in" aria-label="Zoom in">+</button>
        <button id="home" aria-label="Reset view">⌂</button>
        <button id="zen" aria-label="Zen mode" aria-pressed="false" title="Zen mode (Z)">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
        </button>
      </div>
      <canvas id="mini" width="176" height="104" aria-hidden="true"></canvas>
    </div>
    <footer><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a><a href="https://registry.opendata.aws/nz-elevation/">LINZ LiDAR</a><a href="https://data.linz.govt.nz/layer/123014-hamilton-005m-urban-aerial-photos-2024-2025/">LINZ aerial imagery</a><a href="https://open-meteo.com/">Weather by Open-Meteo</a><span class="hint">Drag to pan · Scroll or pinch to zoom</span></footer>
  </main>
  <script type="module" src="viewer.js?life=3"></script>
</body>
</html>
